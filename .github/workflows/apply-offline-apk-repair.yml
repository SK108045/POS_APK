name: Apply offline APK repair

on:
  workflow_dispatch:
  push:
    paths:
      - tools/repair_offline_apk.py
      - .github/workflows/apply-offline-apk-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix one-time repair script substitutions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/repair_offline_apk.py')
          s = p.read_text()
          s = s.replace("app = pattern.sub(localpos + '\\n', app, count=1)", "app = pattern.sub(lambda _m: localpos + '\\n', app, count=1)")
          s = s.replace("app = pos_pat.sub(pos_layout + '\\nfunction getCategoryIcon', app, count=1)", "app = pos_pat.sub(lambda _m: pos_layout + '\\nfunction getCategoryIcon', app, count=1)")
          p.write_text(s)
          PY

      - name: Apply repair
        run: python3 tools/repair_offline_apk.py

      - name: Validate JavaScript syntax
        run: |
          node --check capacitor/www/app.js
          node --check capacitor/src/sqlite-bridge.js

      - name: Validate package files
        run: |
          python3 -m json.tool capacitor/package.json >/dev/null
          python3 -m json.tool capacitor/capacitor.config.json >/dev/null

      - name: Commit repaired APK source and remove one-time workflow
        run: |
          rm -f tools/repair_offline_apk.py .github/workflows/apply-offline-apk-repair.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair offline mobile POS APK" || exit 0
          git push
