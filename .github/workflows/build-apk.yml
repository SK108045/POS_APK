name: Build Oraforge POS Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # The Android SDK is pre-installed on ubuntu-latest runners.
      # Confirm ANDROID_HOME is set and accept licenses.
      - name: Accept Android SDK licences
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            capacitor/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('capacitor/android/**/*.gradle*', 'capacitor/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: capacitor/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('capacitor/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install Capacitor dependencies
        working-directory: capacitor
        run: npm install

      - name: Add Android platform
        working-directory: capacitor
        run: npx cap add android

      - name: Sync Capacitor (copy web assets + update native)
        working-directory: capacitor
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        working-directory: capacitor/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: capacitor/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oraforge-pos-apk
          path: capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
