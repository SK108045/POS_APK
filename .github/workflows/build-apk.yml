name: Build Oraforge POS Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('capacitor/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install Capacitor dependencies
        working-directory: capacitor
        run: npm ci

      - name: Add Android platform
        working-directory: capacitor
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: capacitor/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oraforge-pos-apk
          path: capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
