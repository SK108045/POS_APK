name: Run customer marketing admin fix now

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-customer-marketing-admin-fix-now.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: python3 scripts/fix_customer_marketing_admin.py
      - name: Validate
        run: |
          python3 -m py_compile app.py profiles.py
          node --check static/app.js
          node --check static/admin.js
          grep -q 'checkoutCustomerPhone' static/app.js
          grep -q 'Saved from POS checkout' app.py
          grep -q 'adminBusinessName' app.py
          grep -q 'Thanks for dining with us' static/admin.js
      - name: Commit
        run: |
          rm -f scripts/fix_customer_marketing_admin.py
          rm -f .github/workflows/apply-customer-marketing-admin-fix.yml
          rm -f .github/workflows/run-customer-marketing-admin-fix-now.yml
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py static/app.js static/admin.js scripts/fix_customer_marketing_admin.py .github/workflows/apply-customer-marketing-admin-fix.yml .github/workflows/run-customer-marketing-admin-fix-now.yml
          git commit -m 'Improve customer capture, promo copy, and shop-specific admin'
          git push origin HEAD:main
