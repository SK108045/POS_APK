name: Finalize Africa's Talking SMS marketing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-africastalking-sms.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply implementation
        run: python3 scripts/finalize_africastalking_sms.py

      - name: Install Python requirements
        run: python3 -m pip install -r requirements.txt

      - name: Validate
        run: |
          python3 -m py_compile app.py
          node --check static/admin.js
          python3 - <<'PY'
          import africastalking
          print('africastalking import OK')
          PY
          grep -Fq '/api/admin/sms/send' app.py
          grep -Fq "SMS Marketing · Africa's Talking" static/admin.js

      - name: Commit implementation
        run: |
          rm -f scripts/add_africastalking_sms.py scripts/finalize_africastalking_sms.py
          rm -f .github/workflows/add-africastalking-sms.yml .github/workflows/finalize-africastalking-sms.yml
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py static/admin.js requirements.txt scripts/add_africastalking_sms.py scripts/finalize_africastalking_sms.py .github/workflows/add-africastalking-sms.yml .github/workflows/finalize-africastalking-sms.yml
          git commit -m "Add Africa's Talking SMS marketing to admin portal"
          git push origin HEAD:main
