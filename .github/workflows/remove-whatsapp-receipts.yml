name: Remove WhatsApp receipts (one-time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-whatsapp-receipts.yml'

permissions:
  contents: write

jobs:
  remove-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove WhatsApp receipt feature
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('static/app.js')
          css_path = Path('static/styles.css')
          app = app_path.read_text()
          css = css_path.read_text()

          start_marker = '\n\n// ── WhatsApp Receipt Helpers ─────────────────────────────────────────────────\n'
          end_marker = '// ── Receipt Modal ─────────────────────────────────────────────────────────────\n'
          if start_marker not in app or end_marker not in app:
              raise SystemExit('WhatsApp helper block markers not found')
          start = app.index(start_marker)
          end = app.index(end_marker, start)
          app = app[:start] + '\n' + app[end:]

          old_actions = '''        <div class="receipt-actions">\n          <button id="receiptPrintBtn">Print ${isQuote ? 'Quotation' : 'Receipt'}</button>\n          <button id="receiptWhatsAppBtn" type="button">Send via WhatsApp</button>\n        </div>'''
          new_actions = '''        <button id="receiptPrintBtn">Print ${isQuote ? 'Quotation' : 'Receipt'}</button>'''
          if old_actions not in app:
              raise SystemExit('Receipt WhatsApp button block not found')
          app = app.replace(old_actions, new_actions, 1)

          listener = "  document.getElementById('receiptWhatsAppBtn')?.addEventListener('click', () => showWhatsAppReceiptDialog(order));\n"
          if listener not in app:
              raise SystemExit('WhatsApp receipt listener not found')
          app = app.replace(listener, '', 1)

          css_block = '''.receipt-actions {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 8px;\n  margin-top: 8px;\n}\n\n.receipt-actions button {\n  margin: 0;\n}\n\n#receiptWhatsAppBtn {\n  background: #16a34a !important;\n  color: #ffffff !important;\n  -webkit-text-stroke: 0 !important;\n}\n\n@media (max-width: 420px) {\n  .receipt-actions { grid-template-columns: 1fr; }\n}\n\n'''
          if css_block not in css:
              raise SystemExit('WhatsApp receipt CSS block not found')
          css = css.replace(css_block, '', 1)

          old_print = '''  #receiptModal .receipt-modal-close,\n  #receiptModal #receiptPrintBtn,\n  #receiptModal #receiptWhatsAppBtn { display: none !important; }'''
          new_print = '''  #receiptModal .receipt-modal-close,\n  #receiptModal #receiptPrintBtn { display: none !important; }'''
          if old_print not in css:
              raise SystemExit('WhatsApp print selector not found')
          css = css.replace(old_print, new_print, 1)

          app_path.write_text(app)
          css_path.write_text(css)
          PY

          node --check static/app.js
          if grep -RniE 'WhatsApp|wa\.me|whatsappReceipt|receiptWhatsApp' static/app.js static/styles.css; then
            echo 'WhatsApp receipt references remain' >&2
            exit 1
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          rm -f .github/workflows/remove-whatsapp-receipts.yml
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js static/styles.css .github/workflows/remove-whatsapp-receipts.yml
          git commit -m 'Remove WhatsApp receipt feature'
          git push origin HEAD:main
