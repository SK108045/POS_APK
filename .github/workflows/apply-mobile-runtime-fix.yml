name: Apply mobile runtime fixes

on:
  push:
    paths:
      - tools/fix_mobile_runtime.py
      - .github/workflows/apply-mobile-runtime-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixes
        run: python3 tools/fix_mobile_runtime.py

      - name: Validate JavaScript
        run: |
          node --check capacitor/www/app.js
          node --check capacitor/www/admin.js
          node --check capacitor/src/sqlite-bridge.js

      - name: Commit application changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capacitor/www/app.js capacitor/www/styles.css capacitor/www/admin.js capacitor/www/admin.html capacitor/www/admin.css capacitor/src/sqlite-bridge.js
          git commit -m "Fix APK admin login responsiveness and image search" || exit 0
          git push
