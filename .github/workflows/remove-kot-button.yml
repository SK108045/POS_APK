name: Remove KOT button

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-kot-button.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply change
        run: python3 scripts/remove_kot_button.py
      - name: Validate
        run: |
          node --check static/app.js
          if grep -Fq 'Send KOT' static/app.js; then
            echo 'Send KOT button still present' >&2
            exit 1
          fi
          if grep -Fq "#kotBtn" static/app.js; then
            echo 'KOT button handler still present' >&2
            exit 1
          fi
      - name: Commit implementation
        run: |
          rm -f scripts/remove_kot_button.py
          rm -f .github/workflows/remove-kot-button.yml
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js scripts/remove_kot_button.py .github/workflows/remove-kot-button.yml
          git commit -m 'Remove Send KOT button from POS'
          git push origin HEAD:main
