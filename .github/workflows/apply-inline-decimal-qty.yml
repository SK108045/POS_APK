name: Apply inline decimal quantity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-inline-decimal-qty.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: python3 scripts/add_inline_decimal_qty.py
      - name: Validate
        run: |
          node --check static/app.js
          grep -q 'cart-qty-input' static/app.js
      - name: Commit implementation
        run: |
          rm -f scripts/add_inline_decimal_qty.py
          rm -f .github/workflows/apply-inline-decimal-qty.yml
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js scripts/add_inline_decimal_qty.py .github/workflows/apply-inline-decimal-qty.yml
          git commit -m 'Edit decimal quantities directly in cart'
          git push origin HEAD:main
