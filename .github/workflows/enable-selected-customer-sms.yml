name: Enable selected-customer SMS marketing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-selected-customer-sms.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply selected-customer SMS patch
        run: python3 scripts/enable_selected_customer_sms.py

      - name: Validate
        run: |
          python3 -m py_compile app.py
          node --check static/admin.js
          grep -Fq 'customer_ids' app.py
          grep -Fq 'Send SMS to Selected' static/admin.js
          grep -Fq 'bulk_enabled' app.py
          if grep -Fq 'Send Demo SMS' static/admin.js; then
            echo 'Demo-only SMS button still present'
            exit 1
          fi

      - name: Commit implementation
        run: |
          rm -f scripts/enable_selected_customer_sms.py
          rm -f .github/workflows/enable-selected-customer-sms.yml
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py static/admin.js scripts/enable_selected_customer_sms.py .github/workflows/enable-selected-customer-sms.yml
          git commit -m 'Send SMS campaigns to selected customers'
          git push origin HEAD:main
