name: Fix Africa's Talking 1.2.9 compatibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-africastalking-129.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply compatibility fix
        run: python3 scripts/fix_africastalking_129.py

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Validate
        run: |
          python3 -m py_compile app.py
          python3 - <<'PY'
          import inspect
          import africastalking
          africastalking.initialize('sk10', 'dummy')
          sig = inspect.signature(africastalking.SMS.send)
          print('SMS.send signature:', sig)
          assert 'timeout' not in sig.parameters
          from pathlib import Path
          s = Path('app.py').read_text()
          assert 'africastalking.SMS.send(message, recipients, timeout=30)' not in s
          assert 'africastalking.SMS.send(message, recipients)' in s
          print('Africa\'s Talking 1.2.9 compatibility validated')
          PY

      - name: Commit implementation
        run: |
          rm -f scripts/fix_africastalking_129.py
          rm -f .github/workflows/fix-africastalking-129.yml
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py scripts/fix_africastalking_129.py .github/workflows/fix-africastalking-129.yml
          git commit -m "Fix Africa's Talking 1.2.9 SMS call"
          git push origin HEAD:main
