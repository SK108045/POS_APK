name: Scope business workspaces

on:
  push:
    branches: [main]
    paths:
      - 'scripts/scope_business_workspaces.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply workspace isolation
        run: python3 scripts/scope_business_workspaces.py
      - name: Validate syntax and DB migration
        run: |
          python3 -m py_compile app.py profiles.py
          node --check static/app.js
          node --check static/admin.js
          python3 - <<'PY'
          import app
          app.init_db()
          with app.db() as conn:
              for table in ('orders','customers','suppliers','stock_purchases','stock_movements'):
                  cols = {r['name'] for r in conn.execute(f'PRAGMA table_info({table})')}
                  assert 'business_type' in cols, (table, cols)
              groups = conn.execute("SELECT business_type, COUNT(*) n FROM orders GROUP BY business_type").fetchall()
              print('Order workspaces:', [(r['business_type'], r['n']) for r in groups])
          PY
          grep -q 'Shop Category / Workspace' app.py
          grep -q 'business_type = ?' app.py
          grep -q 'Only this shop category' static/admin.js
      - name: Commit isolated workspace implementation
        run: |
          rm -f scripts/scope_business_workspaces.py
          rm -f .github/workflows/scope-business-workspaces.yml
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py static/admin.js data/pos.sqlite3 scripts/scope_business_workspaces.py .github/workflows/scope-business-workspaces.yml || true
          git reset data/pos.sqlite3 || true
          git commit -m 'Isolate POS data by shop category'
          git push origin HEAD:main
