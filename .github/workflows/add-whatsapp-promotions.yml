name: Add WhatsApp promotions

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-whatsapp-promotions.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply changes
        run: python3 scripts/add_whatsapp_promotions.py

      - name: Validate
        run: |
          node --check static/admin.js
          python3 -m py_compile app.py profiles.py
          grep -q 'data-section="promotions"' app.py
          grep -q 'const PROMO_PROFILE_COPY' static/admin.js

      - name: Commit
        run: |
          rm -f scripts/add_whatsapp_promotions.py
          rm -f .github/workflows/add-whatsapp-promotions.yml
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py static/admin.js static/admin.css scripts/add_whatsapp_promotions.py .github/workflows/add-whatsapp-promotions.yml
          git commit -m 'Add business-specific WhatsApp promotions to admin'
          git push origin HEAD:main
