name: Roll back last SMS delivery fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rollback-last-sms-fix.yml'

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Restore previous stable SMS code
        run: |
          git checkout 0f3f9889bc1089af13e91a02bf2e62684ac96d37 -- app.py static/admin.js

      - name: Validate restored files
        run: |
          python3 -m py_compile app.py
          node --check static/admin.js

      - name: Commit rollback
        run: |
          rm -f .github/workflows/rollback-last-sms-fix.yml
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py static/admin.js .github/workflows/rollback-last-sms-fix.yml
          git commit -m 'Revert SMS delivery changes to previous stable version'
          git push origin HEAD:main
