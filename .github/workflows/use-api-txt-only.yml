name: Use api.txt for Africa's Talking

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/use-api-txt-only.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply api.txt-only config
        run: python3 scripts/use_api_txt_only.py

      - name: Validate
        run: |
          python3 -m py_compile app.py
          python3 - <<'PY'
          from pathlib import Path
          s = Path('app.py').read_text()
          block = s[s.index('def africastalking_sms_config():'):s.index('def send_africastalking_sms')]
          assert 'AFRICASTALKING_API_KEY' not in block
          assert 'AFRICASTALKING_USERNAME' not in block
          assert 'BASE_DIR / "api.txt"' in block
          assert 'username = "sk10"' in block
          assert 'demo_number = "+254756205063"' in block
          print('api.txt-only Africa\'s Talking config validated')
          PY

      - name: Commit implementation
        run: |
          rm -f scripts/use_api_txt_only.py
          rm -f .github/workflows/use-api-txt-only.yml
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py scripts/use_api_txt_only.py .github/workflows/use-api-txt-only.yml
          git commit -m "Use api.txt directly for Africa's Talking SMS"
          git push origin HEAD:main
