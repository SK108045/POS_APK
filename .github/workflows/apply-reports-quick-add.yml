name: Apply reports and quick-add fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-reports-quick-add.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply patch
        run: python3 scripts/fix_reports_quick_add.py

      - name: Install runtime dependency
        run: pip install pillow -q

      - name: Validate code and report ranges
        run: |
          python3 -m py_compile app.py profiles.py
          node --check static/app.js
          node --check static/admin.js
          python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import app

          tz = ZoneInfo('Africa/Nairobi')
          ref = int(datetime(2026, 9, 18, 10, 47, 0, tzinfo=tz).timestamp())

          s, e, label = app.report_period_bounds('today', ref)
          sd = datetime.fromtimestamp(s, tz)
          assert (sd.year, sd.month, sd.day, sd.hour, sd.minute) == (2026, 9, 18, 0, 0)
          assert e == ref + 1

          ys, ye, _ = app.report_period_bounds('yesterday', ref)
          assert datetime.fromtimestamp(ys, tz).date().isoformat() == '2026-09-17'
          assert datetime.fromtimestamp(ye, tz).date().isoformat() == '2026-09-18'
          assert ye - ys == 86400

          ws, we, _ = app.report_period_bounds('week', ref)
          assert datetime.fromtimestamp(ws, tz).date().isoformat() == '2026-09-12'
          assert we == ref + 1

          ms, me, _ = app.report_period_bounds('month', ref)
          assert datetime.fromtimestamp(ms, tz).date().isoformat() == '2026-08-20'
          assert me == ref + 1

          app.init_db()
          with app.db() as conn:
              order_cols = {r['name'] for r in conn.execute('PRAGMA table_info(orders)')}
              item_cols = {r['name'] for r in conn.execute('PRAGMA table_info(order_items)')}
              assert 'paid_at' in order_cols
              assert 'cost_cents' in item_cols
              missing_paid = conn.execute("SELECT COUNT(*) FROM orders WHERE status='paid' AND paid_at IS NULL").fetchone()[0]
              missing_cost = conn.execute("SELECT COUNT(*) FROM order_items WHERE cost_cents IS NULL").fetchone()[0]
              assert missing_paid == 0, missing_paid
              assert missing_cost == 0, missing_cost
          print('Report boundary and snapshot migration tests passed')
          PY
          if grep -Fq "showQtyPopup(item);" static/app.js; then
            echo 'Normal product click still opens quantity popup' >&2
            exit 1
          fi
          grep -Fq 'COALESCE(o.paid_at, o.updated_at)' app.py
          grep -Fq 'M-Pesa Sales' static/app.js

      - name: Commit implementation
        run: |
          rm -f scripts/fix_reports_quick_add.py
          rm -f .github/workflows/apply-reports-quick-add.yml
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py static/app.js scripts/fix_reports_quick_add.py .github/workflows/apply-reports-quick-add.yml
          git commit -m 'Fix report periods and add products directly to cart'
          git push origin HEAD:main
