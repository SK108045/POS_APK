name: Apply active navbar state fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-nav-active-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply navbar fix
        run: python3 scripts/nav_active_fix.py

      - name: Validate
        run: |
          node --check static/app.js
          grep -Fq 'aria-current="page"' static/app.js
          grep -Fq 'background: #e4e4e7;' static/styles.css

      - name: Commit implementation
        run: |
          rm -f scripts/nav_active_fix.py
          rm -f .github/workflows/apply-nav-active-fix.yml
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js static/styles.css scripts/nav_active_fix.py .github/workflows/apply-nav-active-fix.yml
          git commit -m 'Highlight active top navigation page'
          git push origin HEAD:main
